services:
  # ========== MySQL ==========
  mysql:
    image: mysql:8.0
    container_name: tagmind-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-tagmind123}
      MYSQL_DATABASE: ${DB_NAME:-tagmind}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-tagmind123}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ========== Redis ==========
  redis:
    image: redis:7-alpine
    container_name: tagmind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # ========== API 服务 ==========
  api:
    build: ./server
    container_name: tagmind-api
    restart: unless-stopped
    environment:
      - PORT=3000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-tagmind123}
      - DB_NAME=${DB_NAME:-tagmind}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-tagmind_default_secret}
      - JWT_EXPIRES_IN=7d
      - AI_API_BASE=${AI_API_BASE}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL}
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # ========== Worker 进程 ==========
  worker:
    build: ./server
    container_name: tagmind-worker
    restart: unless-stopped
    command: node worker.js
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-tagmind123}
      - DB_NAME=${DB_NAME:-tagmind}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_API_BASE=${AI_API_BASE}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      api:
        condition: service_started

  # ========== Nginx 反向代理 ==========
  nginx:
    image: nginx:alpine
    container_name: tagmind-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./web/dist:/usr/share/nginx/html
    depends_on:
      - api

volumes:
  mysql_data:
  redis_data:
